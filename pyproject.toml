[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-hospitality-enterprise-data-platform"
version = "0.1.0"
description = "Synthetic enterprise data platform for gaming and hospitality modernization"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
cloud = [
  "google-cloud-pubsub>=2.23,<3",
  "google-cloud-storage>=2.18,<3",
  "google-cloud-bigquery>=3.25,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "orjson>=3.10,<4",
  "tenacity>=9,<10",
]
legacy = [
  "pyodbc>=5.1,<6",
  "ibm-db>=3.2,<4",
]
ml = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]
full = [
  "gaming-hospitality-enterprise-data-platform[cloud,legacy,ml]",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/resort_platform/production_reference.py" = ["F401"]
