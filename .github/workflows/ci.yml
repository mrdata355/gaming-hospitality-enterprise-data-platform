name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - name: Repository architecture validation
        run: python scripts/validate_repository.py
      - name: Ruff
        run: ruff check src tests agents collaboration digital_twin finops mlops
      - name: Tests
        run: pytest -q

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.9.8'}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
